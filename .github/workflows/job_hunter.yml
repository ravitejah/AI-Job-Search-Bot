name: Job Hunter Bot

on:
  schedule:
    # 9:00 AM IST (3:30 UTC) EVERY DAY
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Create config.py from secrets
        env:
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          EMAIL_SENDER:    ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          cat > config.py << PYEOF
          PROFILE = {
              "name": "Raviteja Ramisetti",
              "email": "$EMAIL_SENDER",
              "phone": "+91 93471 34834",
              "linkedin": "https://www.linkedin.com/in/ravitejarin/",
              "github": "https://github.com/ravitejah",
              "location": "Hyderabad, Telangana",
              "resume_path": "data/resume.pdf",
              "skills": [
                  "Java", "JavaScript", "TypeScript", "Spring Boot", 
                  "Spring Data JPA", "Spring Security", "Angular", 
                  "PostgreSQL", "MySQL", "Retool", "REST API", 
                  "Microservices", "Backend Development", "Full Stack Development"
              ],
              "education": "BTech in Electrical and Electronics Engineering, 2024",
              "experience_years": 1.5,
              "summary": "Java Full Stack Developer with 1.5 years of experience building robust backend services with Spring Boot and developing internal dashboards using Retool and Angular. Targeting roles in the 10-16 LPA range."
          }
          SEARCH = {
              "roles": [
                  "SWE", "SWE 1", "SWE I", "SDE", "SDE 1", "SDE I",
                  "Java Backend Engineer", "Java Backend Developer",
                  "Java Full Stack Developer", "Junior Java Developer",
                  "Java Developer", "Java Software Engineer"
              ],
              "locations": [
                  "Hyderabad, Telangana",
                  "Chennai, Tamil Nadu",
                  "Visakhapatnam, Andhra Pradesh",
                  "Bengaluru, Karnataka",
                  "Remote"
              ],
              "job_types": ["Full-time"],
              "experience_levels": ["Entry level", "Associate"],
              "min_match_score": 85, 
              "auto_apply_min_score": 0,
              "keywords_required": ["java"],
              "keywords_excluded": ["intern", "internship", "contract", "freelance", "senior", "sr", "lead", "architect", "manager", "principal", "staff", "ii", "iii", " 2", " 3", " 4"]
          }
          SCHEDULER = {
              "check_interval_minutes": 60,
              "max_applies_per_day": 0,
              "apply_delay_seconds": 45,
          }
          NOTIFICATIONS = {
              "email_enabled": True,
              "email_sender":    "$EMAIL_SENDER",
              "email_password":  "$EMAIL_PASSWORD",
              "email_recipient": "$EMAIL_RECIPIENT",
              "telegram_enabled": False,
              "telegram_bot_token": "",
              "telegram_chat_id": "",
          }
          AI = {
              "groq_api_key": "$GROQ_API_KEY",
              "model": "llama-3.1-8b-instant",
              "match_model": "llama-3.1-8b-instant",
          }
          DATABASE = {
              "path": "data/jobs.db",
          }
          PYEOF

      - name: Restore jobs database
        uses: actions/cache@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: Create data directory
        run: mkdir -p data

      - name: Run Job Hunter
        run: python main.py --once

      - name: Save jobs database
        uses: actions/cache@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}